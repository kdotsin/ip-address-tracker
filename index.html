<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>IP Address Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @layer components {
        .address-container {
          @apply mx-auto max-w-4xl rounded-2xl bg-white p-6 shadow-lg;
        }

        .address-cards {
          @apply flex flex-col gap-4 md:flex-row md:divide-x md:divide-gray-300;
        }

        .address-detail {
          @apply flex-1 md:px-6;
        }

        .card-title {
          @apply text-xs tracking-widest text-gray-400;
        }

        .card-content {
          @apply text-xl font-bold;
        }

        .ip-input {
          @apply flex-1 rounded-l-2xl bg-white px-5 py-3 text-sm outline-none placeholder:text-gray-400;
        }

        .search-btn {
          @apply rounded-r-2xl bg-black px-5 cursor-pointer rounded-r-2xl bg-black px-5;
        }

        .bg-img {
          @apply relative bg-cover md:bg-size-[100%_220px] md:bg-no-repeat bg-[url('./src/images/pattern-bg-mobile.png')] md:bg-[url('./src/images/pattern-bg-desktop.png')];
        }
      }
    </style>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script type="module" src="./dist/index.js" defer></script>
  </head>
  <body class="flex min-h-screen flex-col">
    <header
      class="flex h-80 flex-col items-center gap-10 px-6 pt-8 bg-img md:h-[220px]"
    >
      <h1 class="text-2xl font-medium text-white">IP Address Tracker</h1>
      <form class="mx-auto flex w-full max-w-xl" id="ip-search">
        <input
          id="ip-input"
          type="text"
          class="ip-input"
          placeholder="Search for any IP address or domain"
        />
        <button type="submit" class="search-btn volume-btn" aria-label="Search">
          <img src="./src/images/icon-arrow.svg" alt="Submit Form" />
        </button>
      </form>

      <section class="address-container absolute inset-x-6 bottom-0 z-10 translate-y-1/2" aria-label="IP address details">
        <dl class="address-cards">
          <div class="address-detail">
            <dt class="card-title">IP Address</dt>
            <dd class="card-content" id="ip-address"></dd>
          </div>
          <div class="address-detail">
            <dt class="card-title">Location</dt>
            <dd class="card-content" id="ip-location"></dd>
          </div>
          <div class="address-detail">
            <dt class="card-title">Timezone</dt>
            <dd class="card-content" id="ip-timezone"></dd>
          </div>
          <div class="address-detail">
            <dt class="card-title">ISP</dt>
            <dd class="card-content" id="ip-isp"></dd>
          </div>
        </dl>
      </section>
    </header>
    <main id="map" class="relative z-0 flex-1"></main>
  </body>
</html>
